<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>らっだぁ 動画投稿記録</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #eef1f7; color: #333; }
    h1 { font-size: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px; border: none; border-radius: 10px; background: #dde2ee; color: #555; font-size: 14px; }
    .tab.active { background: #7a8bb5; color: #fff; }

    /* 検索・絞り込み */
    .search { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 2px solid #dde2ee; border-radius: 12px; font-size: 16px; background: #fff; margin-bottom: 8px; }
    .search:focus { outline: none; border-color: #7a8bb5; }
    .chips { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .chip { padding: 6px 14px; border: none; border-radius: 16px; background: #fff; color: #555; font-size: 13px; }
    .chip.active { background: #7a8bb5; color: #fff; }
    .gamesel { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 2px solid #dde2ee; border-radius: 12px; font-size: 14px; background: #fff; margin-bottom: 8px; }
    .count { font-size: 12px; color: #888; margin: 0 0 10px 4px; }

    /* リスト */
    .card { display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 12px; align-items: center; }
    .thumb { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #dde2ee; flex-shrink: 0; }
    .info { min-width: 0; }
    .date { font-size: 12px; color: #888; margin-bottom: 4px; }
    .type { display: inline-block; font-size: 11px; background: #7a8bb5; color: #fff; border-radius: 8px; padding: 2px 8px; margin-left: 6px; }
    .type.ショート { background: #e08a9b; }
    .type.配信 { background: #6aa88f; }
    .game { display: inline-block; font-size: 11px; background: #eef1f7; color: #667; border-radius: 8px; padding: 2px 8px; margin-left: 4px; }
    a { color: #333; font-weight: bold; text-decoration: none; font-size: 14px; line-height: 1.4; }
    .more { display: block; width: 100%; padding: 12px; border: none; border-radius: 12px; background: #7a8bb5; color: #fff; font-size: 14px; margin-bottom: 24px; }
    .empty { text-align: center; color: #888; padding: 24px 0; }

    /* 月カレンダー */
    .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .nav button { width: 40px; height: 40px; border: none; border-radius: 50%; background: #fff; font-size: 16px; }
    .nav .month { font-weight: bold; font-size: 18px; text-align: center; }
    .nav .sub { display: block; font-size: 12px; color: #888; font-weight: normal; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; background: #fff; padding: 6px; border-radius: 12px; }
    .dow { text-align: center; font-size: 12px; color: #888; padding: 4px 0; }
    .cell { position: relative; aspect-ratio: 1 / 1; background: #f4f6fb; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
    .cell img { width: 100%; flex: 1; min-height: 0; object-fit: cover; display: block; }
    .cell .num { position: absolute; right: 3px; bottom: 1px; font-size: 14px; font-weight: bold; color: #aab3cc; }
    .cell.has .num { color: #fff; text-shadow: 0 0 4px #000, 0 0 2px #000; }
    .cell.has { cursor: pointer; }
    #dayList { margin-top: 12px; }
    #dayList h2 { font-size: 14px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <h1>らっだぁ 動画投稿記録</h1>

  <input class="search" id="search" type="search" placeholder="タイトルで検索（例：OneShot）">

  <div class="chips" id="chips"></div>
  <select class="gamesel" id="gameSel"><option value="">ゲーム：すべて</option></select>
  <p class="count" id="count"></p>

  <div class="tabs">
    <button class="tab active" id="tabList">リスト</button>
    <button class="tab" id="tabMonth">月</button>
  </div>

  <div id="listView"></div>

  <div id="monthView" style="display:none">
    <div class="nav">
      <button id="prev">＜</button>
      <div class="month" id="monthLabel"></div>
      <button id="next">＞</button>
    </div>
    <div class="grid" id="grid"></div>
    <div id="dayList"></div>
  </div>

  <script>
    let videos = [];
    let query = "";
    let typeFilter = "";
    let gameFilter = "";
    let view = "list";
    let shown = 50;
    let cur = new Date();
    cur = new Date(cur.getFullYear(), cur.getMonth(), 1);

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function norm(s) {
      return s.normalize("NFKC").toLowerCase();
    }

    function filtered() {
      const words = norm(query).split(/\s+/).filter(Boolean);
      return videos.filter(v => {
        if (typeFilter && v.type !== typeFilter) return false;
        if (gameFilter && v.game !== gameFilter) return false;
        if (!words.length) return true;
        const text = norm(v.title + " " + v.date + " " + v.type + " " + (v.game || ""));
        return words.every(w => text.includes(w));
      });
    }

    function thumbUrl(url) {
      const m = url.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
      return m ? `https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg` : "";
    }

    function cardHtml(v) {
      const game = v.game ? `<span class="game">${esc(v.game)}</span>` : "";
      return `
        <div class="card">
          <a href="${esc(v.url)}" target="_blank">
            <img class="thumb" src="${thumbUrl(v.url)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">
          </a>
          <div class="info">
            <div class="date">${esc(v.date)}<span class="type ${esc(v.type)}">${esc(v.type)}</span>${game}</div>
            <a href="${esc(v.url)}" target="_blank">${esc(v.title)}</a>
          </div>
        </div>`;
    }

    function renderList() {
      const list = filtered();
      const box = document.getElementById("listView");
      if (!list.length) {
        box.innerHTML = '<div class="empty">見つかりませんでした</div>';
        return;
      }
      let html = list.slice(0, shown).map(cardHtml).join("");
      if (list.length > shown) {
        html += `<button class="more" id="more">もっと見る（残り${list.length - shown}本）</button>`;
      }
      box.innerHTML = html;
      const more = document.getElementById("more");
      if (more) more.onclick = () => { shown += 50; renderList(); };
    }

    function renderMonth() {
      const list = filtered();
      const y = cur.getFullYear(), m = cur.getMonth();
      const prefix = `${y}-${String(m + 1).padStart(2, "0")}`;
      const inMonth = list.filter(v => v.date.startsWith(prefix));
      document.getElementById("monthLabel").innerHTML =
        `${y}年${m + 1}月<span class="sub">${inMonth.length}本</span>`;

      const byDay = {};
      inMonth.forEach(v => {
        const d = Number(v.date.slice(8, 10));
        (byDay[d] = byDay[d] || []).push(v);
      });

      const first = (new Date(y, m, 1).getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      let html = ["月","火","水","木","金","土","日"].map(d => `<div class="dow">${d}</div>`).join("");
      for (let i = 0; i < first; i++) html += "<div></div>";
      for (let d = 1; d <= days; d++) {
        const items = byDay[d] || [];
        const imgs = items.slice(0, 4).map(v => `<img src="${thumbUrl(v.url)}" loading="lazy" alt="">`).join("");
        html += `<div class="cell ${items.length ? "has" : ""}" data-day="${d}">${imgs}<span class="num">${d}</span></div>`;
      }
      document.getElementById("grid").innerHTML = html;
      document.getElementById("dayList").innerHTML = "";

      document.querySelectorAll(".cell.has").forEach(el => {
        el.addEventListener("click", () => {
          const d = Number(el.dataset.day);
          document.getElementById("dayList").innerHTML =
            `<h2>${m + 1}月${d}日</h2>` + byDay[d].map(cardHtml).join("");
        });
      });
    }

    function updateCount() {
      const n = filtered().length;
      const active = query.trim() || typeFilter || gameFilter;
      document.getElementById("count").textContent =
        active ? `${n}件ヒット（全${videos.length}本）` : `全${videos.length}本`;
    }

    function renderChips() {
      const types = ["", "動画", "ショート", "配信"];
      const box = document.getElementById("chips");
      box.innerHTML = types.map(t =>
        `<button class="chip ${typeFilter === t ? "active" : ""}" data-t="${t}">${t || "すべて"}</button>`
      ).join("");
      box.querySelectorAll(".chip").forEach(b => {
        b.onclick = () => { typeFilter = b.dataset.t; shown = 50; renderChips(); render(); };
      });
    }

    function buildGameSelect() {
      const counts = {};
      videos.forEach(v => { if (v.game) counts[v.game] = (counts[v.game] || 0) + 1; });
      const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const sel = document.getElementById("gameSel");
      sel.innerHTML = '<option value="">ゲーム：すべて</option>' +
        names.map(n => `<option value="${esc(n)}">${esc(n)}（${counts[n]}）</option>`).join("");
      sel.onchange = () => { gameFilter = sel.value; shown = 50; render(); };
    }

    function render() {
      updateCount();
      if (view === "list") renderList(); else renderMonth();
    }

    function show(v) {
      view = v;
      document.getElementById("listView").style.display = v === "list" ? "" : "none";
      document.getElementById("monthView").style.display = v === "month" ? "" : "none";
      document.getElementById("tabList").classList.toggle("active", v === "list");
      document.getElementById("tabMonth").classList.toggle("active", v === "month");
      render();
    }

    document.getElementById("search").addEventListener("input", e => {
      query = e.target.value;
      shown = 50;
      render();
    });
    document.getElementById("tabList").onclick = () => show("list");
    document.getElementById("tabMonth").onclick = () => show("month");
    document.getElementById("prev").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); renderMonth(); };
    document.getElementById("next").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); renderMonth(); };

    fetch("videos.json")
      .then(res => res.json())
      .then(data => {
        videos = data.sort((a, b) => b.date.localeCompare(a.date));
        renderChips();
        buildGameSelect();
        render();
      })
      .catch(() => {
        document.getElementById("listView").textContent = "videos.json を読み込めませんでした";
      });
  </script>
</body>
</html>
