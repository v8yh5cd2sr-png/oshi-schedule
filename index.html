<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>らっだぁ 動画投稿記録</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; background: #eef1f7; color: #333; }
    h1 { font-size: 20px; }
    .card { display: flex; gap: 12px; background: #fff; border-radius: 12px; padding: 10px; margin-bottom: 12px; align-items: center; }
    .thumb { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #dde2ee; flex-shrink: 0; }
    .info { min-width: 0; }
    .date { font-size: 12px; color: #888; margin-bottom: 4px; }
    .type { display: inline-block; font-size: 11px; background: #7a8bb5; color: #fff; border-radius: 8px; padding: 2px 8px; margin-left: 6px; }
    a { color: #333; font-weight: bold; text-decoration: none; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>らっだぁ 動画投稿記録</h1>
  <div id="list">読み込み中...</div>

  <script>
    function thumbUrl(url) {
      const m = url.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
      return m ? `https://i.ytimg.com/vi/${m[1]}/mqdefault.jpg` : "";
    }

    fetch("videos.json")
      .then(res => res.json())
      .then(videos => {
        videos.sort((a, b) => b.date.localeCompare(a.date));
        document.getElementById("list").innerHTML = videos.map(v => `
          <div class="card">
            <a href="${v.url}" target="_blank">
              <img class="thumb" src="${thumbUrl(v.url)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">
            </a>
            <div class="info">
              <div class="date">${v.date}<span class="type">${v.type}</span></div>
              <a href="${v.url}" target="_blank">${v.title}</a>
            </div>
          </div>
        `).join("");
      })
      .catch(() => {
        document.getElementById("list").textContent = "videos.json を読み込めませんでした";
      });
  </script>
</body>
</html>
